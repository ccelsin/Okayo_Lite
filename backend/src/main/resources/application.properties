spring.application.name=OkayoLiteBackend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# --- Database ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.MySQL8Dialect}
spring.jpa.open-in-view=${SPRING_JPA_OPEN_IN_VIEW:true}
spring.jpa.show-sql=false

# --- JWT ---
jwt.secret-key=${JWT_SECRET_KEY}
jwt.expiration-time=${JWT_EXPIRATION_TIME}

# --- Logging ---
logging.level.org.springframework.security=INFO
logging.level.backend.filter.JwtFilter=INFO

# --- Server ---
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# --- Timezone ---
spring.jackson.time-zone=${TZ:Europe/Paris}