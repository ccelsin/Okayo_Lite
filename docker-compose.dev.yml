version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: okayo_mysql_dev
    environment:
      MYSQL_DATABASE: ${DB_NAME:-okayo}
      MYSQL_USER: ${DB_USER:-okayo}
      MYSQL_PASSWORD: ${DB_PASSWORD:-okayo_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_pass}
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - db-data-dev:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-u","${DB_USER:-okayo}","-p${DB_PASSWORD:-okayo_pass}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [devnet]

  backend:
    image: maven:3.9-eclipse-temurin-21
    container_name: okayo_backend_dev
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${DB_NAME:-okayo}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-okayo}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-okayo_pass}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQL8Dialect
      TZ: Europe/Paris
    command: sh -c "mvn -q -DskipTests spring-boot:run"
    volumes:
      - ./backend:/app
      - maven-cache:/root/.m2
    ports:
      - "8080:8080"
    networks: [devnet]

  frontend:
    image: node:20-alpine
    container_name: okayo_frontend_dev
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 3000"
    environment:
      CHOKIDAR_USEPOLLING: "1"
      WATCHPACK_POLLING: "1"
      BACKEND_URL: "http://backend:8080"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks: [devnet]

volumes:
  db-data-dev:
  maven-cache:

networks:
  devnet:
    driver: bridge
